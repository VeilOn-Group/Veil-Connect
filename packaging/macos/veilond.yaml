# /Library/Application Support/VeilOn/veilond.yaml (root:wheel 0644; veilond refuses it otherwise).
# No secrets here: root keys are public keys. Values in <...> are filled
# by the package build (pins of the shipped binaries and API endpoints).
runtime_dir: /var/run/veilon
state_dir: "/Library/Application Support/VeilOn/state"
log_dir: /Library/Logs/VeilOn
singbox:
  path: "/Library/Application Support/VeilOn/sing-box"
  sha256: <SINGBOX_SHA256>
xray:                                  # VLESS: XHTTP and Vision
  path: "/Library/Application Support/VeilOn/xray"
  sha256: <XRAY_SHA256>
update:                                # silent install via veilon-updater
  inbox: "/Library/Application Support/VeilOn/update-inbox"
  work_dir: "/Library/Application Support/VeilOn/update-work"
api:
  base_urls: [<API_BASE_URL>]
  spki_pins: [<SPKI_PIN_CURRENT>, <SPKI_PIN_BACKUP>]
trust:
  root_keys: [{id: root-1, key: <ROOT_PUBLIC_KEY_B64>}]
local_api:
  socket: /var/run/veilon/sock/veilond.sock
  # Members of this group may control the VPN (connect, settings, account)
  # and nothing more.
  allowed_groups: [veilon-users]
tun_stack: mixed
