# Optional drop-in: /etc/systemd/system/veilond.service.d/app-rules.conf
# Per-app split tunnelling on Linux needs sing-box to read other users'
# /proc/<pid> entries. Enable only if you use "app" split rules.
[Service]
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_SYS_PTRACE
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_SYS_PTRACE
