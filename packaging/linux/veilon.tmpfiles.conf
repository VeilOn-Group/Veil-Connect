# /usr/lib/tmpfiles.d/veilon.conf
# Inbox: veilond (group veilon) writes, the root helper reads.
d /var/lib/veilon-update        0755 root root   -
d /var/lib/veilon-update/inbox  0770 root veilon -
# Work dir: the helper's private copies and state, root only.
d /var/lib/veilon-update/work   0700 root root   -
